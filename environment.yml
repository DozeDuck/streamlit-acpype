# Python 3.12 + pinned core package versions.
# Important: use prebuilt openbabel-wheel, NEVER the source-built pip package "openbabel".
name: gmx-acpype-min
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - ambertools=24.8
  - pip
  - pip:
      - acpype==2023.10.27
      - streamlit==1.56.0
      - openbabel-wheel==3.1.1.23
